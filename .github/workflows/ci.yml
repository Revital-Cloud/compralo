name: CI - Build & Test

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: revital_ecommerce/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: revital_ecommerce/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api
        run: pnpm run build

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: revital_ecommerce/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov httpx

      - name: Verify app loads
        env:
          PYTHONPATH: app
        run: python -c "from main import app; print('OK')"

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing tests/
