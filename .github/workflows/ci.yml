name: CI - Build & Test

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: revital_ecommerce/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: revital_ecommerce/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app loads
        run: python -c "from app.main import app; print('OK')"

      # Optional: run tests when pytest is added to the project
      # - name: Install pytest
      #   run: pip install pytest
      # - name: Run tests
      #   run: pytest
