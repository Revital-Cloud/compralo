name: Deploy Synkro stack

on:
  push:
    branches:
      - main
      - staging
      - '**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determinar entorno según branch
        id: envcheck
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [[ "${BRANCH}" == "main" ]]; then
            echo "DIR=prod" >> $GITHUB_ENV
          elif [[ "${BRANCH}" == "staging" ]]; then
            echo "DIR=staging" >> $GITHUB_ENV
          else
            echo "DIR=dev" >> $GITHUB_ENV
          fi
          echo "BRANCH_NAME=${BRANCH}" >> $GITHUB_ENV

      - name: Conectar por SSH y desplegar stack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          command_timeout: 30m
          envs: DIR,BRANCH_NAME
          script: |
            set -euo pipefail
            echo "→ Branch: ${BRANCH_NAME} → entorno: ${DIR}"
            echo "→ Refrescando Traefik base y red compartida"
            cd /srv/synkro/containers/base
            docker compose up -d --pull always

            echo "→ Desplegando servicios del entorno ${DIR}"
            cd /srv/synkro/containers/${DIR}
            docker compose pull
            docker compose build
            docker compose up -d --force-recreate
            # docker system prune -af  # habilitar manualmente si se requiere limpiar imágenes
